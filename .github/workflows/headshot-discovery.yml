name: Discover licensed AVHL player portraits

on:
  push:
    branches: [sim-headshots-cc-portraits]
    paths:
      - 'scripts/discover-sim-headshots.mjs'
      - 'data/headshot-roster-index.json'
      - '.github/workflows/headshot-discovery.yml'
  workflow_dispatch:

concurrency:
  group: avhl-headshot-discovery-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check scripts and headshot compatibility
        run: |
          node --check scripts/discover-sim-headshots.mjs
          node --check public/sim/headshots.js
          node scripts/test-sim-headshots.mjs
      - name: Discover copyright-cleared photos
        env:
          HEADSHOT_LIMIT: "0"
          HEADSHOT_REPORT: headshot-discovery-report.json
        run: node scripts/discover-sim-headshots.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: licensed-headshots-1908-audit
          path: |
            headshot-discovery-report.json
            public/sim/headshots.json
          retention-days: 14
      - name: Publish matched, licensed portraits to the headshots PR
        run: |
          cp public/sim/headshots.json /tmp/avhl-discovered-headshots.json
          git fetch origin sim-headshots-cc-portraits
          git reset --hard FETCH_HEAD
          # Preserve newer manually reviewed photos and independent PR edits;
          # only add candidate IDs that are not already present on the branch.
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path = "public/sim/headshots.json";
          const latest = JSON.parse(fs.readFileSync(path, "utf8"));
          const discovery = JSON.parse(fs.readFileSync("/tmp/avhl-discovered-headshots.json", "utf8"));
          latest.playerIds ||= {};
          let added = 0;
          for (const [id, record] of Object.entries(discovery.playerIds || {})) {
            if (latest.playerIds[id] || Object.hasOwn(latest.players || {}, record.name)) continue;
            latest.playerIds[id] = record;
            added++;
          }
          if (added) fs.writeFileSync(path, JSON.stringify(latest, null, 2) + "\n");
          console.log("New licensed player photos merged onto latest branch: " + added);
          NODE
          if git diff --quiet -- public/sim/headshots.json; then
            echo "No new licenses found"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sim/headshots.json
          git commit -m "data(sim): publish identity-checked Wikimedia Commons player portraits"
          git push origin HEAD:sim-headshots-cc-portraits
