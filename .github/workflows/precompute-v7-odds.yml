name: Precompute exact AVHL V7 odds

on:
  workflow_dispatch:
    inputs:
      away:
        description: "Away team abbreviation (e.g. ARI)"
        required: true
        type: string
      home:
        description: "Home team abbreviation (e.g. ATL)"
        required: true
        type: string
      samples:
        description: "Minimum 1,000; use 2,000+ for refinement"
        required: true
        default: "1000"
        type: choice
        options:
          - "1000"
          - "2000"
          - "3000"
          - "5000"

permissions:
  contents: read

concurrency:
  group: avhl-v7-odds-${{ inputs.away }}-${{ inputs.home }}
  cancel-in-progress: false

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Validate shared cache secrets
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.ODDS_UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.ODDS_UPSTASH_REDIS_REST_TOKEN }}
        run: |
          if [ -z "$UPSTASH_REDIS_REST_URL" ] || [ -z "$UPSTASH_REDIS_REST_TOKEN" ]; then
            echo "Set ODDS_UPSTASH_REDIS_REST_URL and ODDS_UPSTASH_REDIS_REST_TOKEN in repository Actions secrets."
            exit 1
          fi
      - name: Calculate and cache exact V7 game and player odds
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.ODDS_UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.ODDS_UPSTASH_REDIS_REST_TOKEN }}
        run: |
          node scripts/precompute-v7-odds.mjs \
            --away "${{ inputs.away }}" --home "${{ inputs.home }}" \
            --target "${{ inputs.samples }}" --site "https://avhl.org"
