name: Refresh AVHL exact V7 odds (every 30 minutes)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Prevent overlapping refreshes writing the same matchup's Redis pool.
concurrency:
  group: avhl-v7-exact-odds-refresh
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.fixtures.outputs.matrix }}
      count: ${{ steps.fixtures.outputs.count }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Check shared V7 odds cache is configured
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.ODDS_UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.ODDS_UPSTASH_REDIS_REST_TOKEN }}
        run: |
          if [ -z "$UPSTASH_REDIS_REST_URL" ] || [ -z "$UPSTASH_REDIS_REST_TOKEN" ]; then
            echo "::error::Configure ODDS_UPSTASH_REDIS_REST_URL and ODDS_UPSTASH_REDIS_REST_TOKEN."
            exit 1
          fi
      - name: Select upcoming live schedule matchups
        id: fixtures
        env:
          AVHL_ODDS_SITE_URL: "https://avhl.org"
          AVHL_ODDS_MAX_MATCHUPS: "16"
        run: node scripts/plan-v7-odds-refresh.mjs

  refresh:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Refresh only when exact V7 lineup/engine samples are missing
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.ODDS_UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.ODDS_UPSTASH_REDIS_REST_TOKEN }}
          AWAY: ${{ matrix.away }}
          HOME: ${{ matrix.home }}
        run: |
          node scripts/precompute-v7-odds.mjs \
            --away "$AWAY" --home "$HOME" \
            --target 1000 --site "https://avhl.org"
