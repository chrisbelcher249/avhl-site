name: Refresh AVHL exact V7 odds (every 30 minutes)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/sim/simulator.js"
      - "public/odds/v7-sample-extractor.js"
      - "src/lib/v7OddsSamples.js"
      - "scripts/precompute-v7-odds.mjs"
      - ".github/workflows/refresh-v7-odds.yml"

permissions:
  contents: read
  id-token: write

# Prevent overlapping refreshes writing the same matchup's Redis pool.
concurrency:
  group: avhl-v7-exact-odds-refresh
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.fixtures.outputs.matrix }}
      count: ${{ steps.fixtures.outputs.count }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Select upcoming live schedule matchups
        id: fixtures
        env:
          AVHL_ODDS_SITE_URL: "https://avhl.org"
          AVHL_ODDS_MAX_MATCHUPS: "16"
        run: node scripts/plan-v7-odds-refresh.mjs

  refresh:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Refresh only when exact V7 lineup/engine samples are missing
        env:
          AWAY: ${{ matrix.away }}
          HOME: ${{ matrix.home }}
        run: |
          node scripts/precompute-v7-odds.mjs \
            --away "$AWAY" --home "$HOME" \
            --target 1000 --site "https://avhl.org" --publish-oidc
